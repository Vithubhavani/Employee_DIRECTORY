
services:
  mysql:
    image: mysql:8.0
    container_name: employee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-company_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Backend
    container_name: employee-backend
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: mysql
      PORT: 5001
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "node database.js && npm start"

  frontend:
    build: ./Frontend
    container_name: employee-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
